set -g history-limit 50000
set -g prefix C-a
setw -g mode-keys vi
bind-key -Tcopy-mode-vi "v" send -X begin-selection
bind-key -Tcopy-mode-vi "y" send -X copy-selection
bind v split-window -h
bind h split-window -v
#set-option display-time 3000
set-option -g allow-rename off
run-shell "powerline-daemon -q"
# load solarized colors
#if-shell "test -f ~/Downloads/solarized/tmux/tmuxcolors-dark.conf" "source ~/Downloads/solarized/tmux/tmuxcolors-dark.conf"
if-shell "test -f ~/powerline/bindings/tmux/powerline.conf" \
	"source ~/powerline/bindings/tmux/powerline.conf"

# Session save/restore across reboots (installed by `make install_tmux_plugins`)
#   prefix C-s  save all sessions, windows, panes, layouts and working dirs
#   prefix C-r  restore the last save
# ssh joins resurrect's default list of programs (vim, less, top, ...) that
# are re-run on restore. continuum also saves automatically every 15 minutes.
set -g @resurrect-processes 'ssh'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
if-shell "test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux" \
	"run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
# continuum hooks its autosave into status-right, so it must load after anything
# that sets the status line (e.g. powerline above)
if-shell "test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux" \
	"run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"
